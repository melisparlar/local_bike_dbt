version: 2

models:
  - name: int_sales_enriched
    description: "Joint les commandes et les articles de commande avec les produits pour enrichir les ventes."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: list_price
        tests:
          - not_null
      - name: total_sales
        description: "Montant total après remise."
        tests:
          - not_null
